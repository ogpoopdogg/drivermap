<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>E&C DRIVER MAP</title>
    <meta name="theme-color" content="#1a1a2e" />
    <link href="//fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ── reset & base ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ── FIXED FULL PAGE, NO SCROLL ── */
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #0b0b14;
            color: #eaeef2;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            min-height: 0;
        }

        :root {
            --accent: #f7c948;
            --card: #16161f;
            --card2: #1e1e2a;
            --border: #2a2a3a;
            --text: #eaeef2;
            --muted: #9aa0b0;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0b14;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a4a;
            border-radius: 6px;
        }

        /* ── header ── */
        header {
            background: #0f0f18;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            position: relative;
            z-index: 10000;
            flex-shrink: 0;
        }

        .badge {
            background: var(--accent);
            color: #0b0b14;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .header-actions button {
            background: var(--card2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .header-actions button:hover {
            background: #2a2a3e;
            border-color: var(--accent);
        }

        .gear-btn {
            background: var(--card2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 10px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            line-height: 1;
        }
        .gear-btn:hover {
            background: #2a2a3e;
            border-color: var(--accent);
        }

        /* ── map wrapper ── */
        .map-wrapper {
            flex: 1;
            background: var(--card);
            border: none;
            border-radius: 0;
            overflow: hidden;
            position: relative;
            min-height: 0;
            height: 100%;
        }

        #dispatch-map {
            width: 100%;
            height: 100%;
        }

        /* ── zoom indicator ── */
        #zoomIndicator {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        /* ── map driver control (top-left) ── */
        .map-driver-control {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            max-height: 260px;
            overflow-y: auto;
            backdrop-filter: blur(4px);
            min-width: 140px;
            max-width: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            margin: 10px 0 0 10px;
        }
        .map-driver-control .driver-entry {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 0;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
            border-radius: 4px;
            padding: 8px 10px;
            margin-bottom: 4px;
        }
        .map-driver-control .driver-entry:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .map-driver-control .driver-entry:last-child {
            border-bottom: none;
        }
        .map-driver-control .driver-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .map-driver-control .driver-name {
            font-weight: 500;
            flex: 0 0 auto;
            font-size: 14px;
            white-space: nowrap;
        }
        .map-driver-control .driver-status {
            font-size: 10px;
            margin-left: auto;
            white-space: nowrap;
            padding: 1px 6px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
        }
        .map-driver-control .driver-status.online {
            color: #2ecc71;
        }
        .map-driver-control .driver-status.standby {
            color: #f1c40f;
        }
        .map-driver-control .driver-status.offline {
            color: #e74c3c;
        }
        .map-driver-control .no-drivers {
            color: var(--muted);
            font-size: 13px;
            padding: 4px 0;
        }

        /* ── map controls (right column) ── */
        .map-controls-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 10px 10px 0 0;
            align-items: flex-end;
        }
        .map-control-btn {
            background: #1e1e2a;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            min-width: 48px;
            text-align: center;
            font-family: 'Inter', sans-serif;
        }
        .map-control-btn:hover {
            background: #2a2a3e;
            border-color: var(--accent);
        }
        .map-control-btn.fit-btn svg {
            width: 20px;
            height: 20px;
            display: block;
            margin: 0 auto;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }
        .map-control-btn.map-type-btn {
            min-width: 72px;
        }

        /* ── settings modal ── */
        .settings-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        .settings-modal .settings-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            max-width: 620px;
            width: 100%;
            padding: 28px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .settings-card h2 {
            margin-bottom: 20px;
        }
        .settings-card .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }
        .settings-card .field label {
            font-weight: 600;
            font-size: 14px;
        }
        .settings-card .field input {
            background: #0b0b14;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 12px;
            outline: none;
        }
        .settings-card .field input:focus {
            border-color: var(--accent);
        }
        .settings-card .driver-row {
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--card2);
            padding: 8px 12px;
            border-radius: 14px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .settings-card .driver-row input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            padding: 6px 4px;
            outline: none;
            min-width: 60px;
        }
        .settings-card .driver-row input.color-pick {
            width: 40px;
            padding: 0;
            height: 34px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            flex: 0 0 40px;
        }
        .settings-card .driver-row .remove-driver {
            background: transparent;
            border: none;
            color: #e74c3c;
            font-weight: 700;
            cursor: pointer;
            font-size: 18px;
            flex: 0 0 auto;
        }
        .settings-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
            flex-wrap: wrap;
        }
        .settings-actions button {
            padding: 10px 24px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .settings-actions .save-btn {
            background: var(--accent);
            color: #0b0b14;
        }
        .settings-actions .test-btn {
            background: #1a3a2a;
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }
        .settings-actions .close-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .settings-card .debug-box {
            background: #0b0b14;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-top: 12px;
            font-size: 13px;
            font-family: monospace;
            max-height: 400px;
            overflow-y: auto;
            color: var(--muted);
            line-height: 1.8;
        }
        .settings-card .debug-box .success {
            color: #2ecc71;
        }
        .settings-card .debug-box .error {
            color: #e74c3c;
        }
        .settings-card .debug-box .info {
            color: #f1c40f;
        }
        .settings-card .debug-box .device-id {
            color: var(--accent);
            font-weight: 700;
            background: #1a1a2e;
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* ── group manager drawer ── */
        .group-drawer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 99998;
            backdrop-filter: blur(2px);
        }
        .group-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 400px;
            max-width: 92vw;
            height: 100%;
            background: var(--card);
            border-left: 1px solid var(--border);
            z-index: 99999;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            overflow-y: auto;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.6);
        }
        .group-drawer.open {
            transform: translateX(0);
        }
        .group-drawer .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .group-drawer .drawer-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }
        .group-drawer .drawer-close {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .group-drawer .drawer-close:hover {
            background: var(--border);
        }

        .group-drawer .create-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .group-drawer .create-section input {
            flex: 1;
            background: #0b0b14;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
        }
        .group-drawer .create-section input:focus {
            border-color: var(--accent);
        }
        .group-drawer .create-section button {
            background: var(--accent);
            border: none;
            color: #0b0b14;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
        }

        .group-drawer .show-all-btn {
            width: 100%;
            padding: 10px;
            background: var(--card2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
            transition: background 0.2s, border-color 0.2s;
            font-size: 14px;
        }
        .group-drawer .show-all-btn:hover {
            border-color: var(--accent);
            background: #2a2a3e;
        }
        .group-drawer .show-all-btn.active {
            border-color: var(--accent);
            background: #2a2a3e;
        }

        .group-drawer .group-list {
            flex: 1;
            overflow-y: auto;
        }
        .group-drawer .group-item {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            transition: border-color 0.2s, background 0.2s;
        }
        .group-drawer .group-item.active {
            border-color: var(--accent);
            background: #2a2a3e;
        }
        .group-drawer .group-item .group-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .group-drawer .group-item .group-name {
            font-weight: 700;
            flex: 1;
            font-size: 15px;
            color: var(--text);
        }
        .group-drawer .group-item .group-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .group-drawer .group-item .group-actions button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .group-drawer .group-item .group-actions button:hover {
            border-color: var(--accent);
            background: #2a2a3e;
        }
        .group-drawer .group-item .group-actions button.show-btn.active-btn {
            border-color: var(--accent);
            background: var(--accent);
            color: #0b0b14;
        }
        .group-drawer .group-item .group-actions button.remove-group {
            color: #e74c3c;
            border-color: #5a1a1a;
        }
        .group-drawer .group-item .group-actions button.remove-group:hover {
            border-color: #e74c3c;
            background: #2a0a0a;
        }

        .group-drawer .group-item .driver-check-list {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            display: none;
            flex-direction: column;
            gap: 6px;
        }
        .group-drawer .group-item .driver-check-list.open {
            display: flex;
        }
        .group-drawer .group-item .driver-check-list .check-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
            font-size: 14px;
        }
        .group-drawer .group-item .driver-check-list .check-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
            flex-shrink: 0;
        }
        .group-drawer .group-item .driver-check-list .check-row label {
            cursor: pointer;
            color: var(--text);
        }
        .group-drawer .group-item .driver-check-list .save-drivers-btn {
            margin-top: 8px;
            padding: 8px 16px;
            background: var(--accent);
            border: none;
            color: #0b0b14;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            align-self: flex-start;
        }
        .group-drawer .group-item .driver-check-list .save-drivers-btn:hover {
            opacity: 0.85;
        }

        .group-drawer .no-groups {
            color: var(--muted);
            font-size: 14px;
            text-align: center;
            padding: 30px 0;
        }

        /* ── login overlay ── */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: #0b0b14;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 100%;
            max-width: 360px;
            background: var(--card);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .login-box h2 {
            color: var(--accent);
            margin-bottom: 20px;
        }
        .login-box input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #0b0b14;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }
        .login-box input:focus {
            border-color: var(--accent);
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: var(--accent);
            border: none;
            color: #0b0b14;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
        }
        #loginError {
            color: #e74c3c;
            margin-top: 12px;
            font-size: 14px;
        }

        /* ── responsive ── */
        @media (max-width: 600px) {
            .map-driver-control {
                min-width: 100px;
                max-width: none;
                font-size: 11px;
                padding: 6px 10px;
                max-height: 200px;
                margin: 6px 0 0 6px;
            }
            .map-driver-control .driver-name {
                font-size: 11px;
            }
            .map-driver-control .driver-status {
                font-size: 9px;
            }
            header {
                padding: 8px 12px;
            }
            header span {
                font-size: 14px !important;
            }
            .header-actions button {
                font-size: 11px;
                padding: 6px 12px;
            }
            .gear-btn {
                font-size: 16px;
                padding: 4px 8px;
            }
            .settings-card {
                padding: 18px;
            }
            .settings-card .driver-row {
                flex-wrap: wrap;
                gap: 6px;
            }
            .settings-card .driver-row input[type="text"] {
                flex: 1 1 100%;
                min-width: 0;
            }
            .settings-card .driver-row input.color-pick {
                width: 50px;
                height: 40px;
                flex: 0 0 50px;
            }
            .settings-card .driver-row .remove-driver {
                flex: 0 0 auto;
            }
            .map-controls-container {
                margin: 6px 6px 0 0;
                gap: 6px;
            }
            .map-control-btn {
                padding: 6px 10px;
                font-size: 11px;
                min-width: 40px;
            }
            .map-control-btn.fit-btn svg {
                width: 18px;
                height: 18px;
            }
            .map-control-btn.map-type-btn {
                min-width: 56px;
                font-size: 11px;
            }
            .group-drawer {
                width: 100%;
                max-width: 100vw;
                padding: 16px 14px;
            }
        }

        @media (max-width: 400px) {
            .map-driver-control {
                min-width: 80px;
                max-width: none;
                font-size: 10px;
                padding: 4px 8px;
                max-height: 160px;
            }
            .map-driver-control .driver-name {
                font-size: 10px;
            }
            .map-driver-control .driver-status {
                font-size: 8px;
                padding: 0 4px;
            }
            .group-drawer .group-item .group-row {
                flex-direction: column;
                align-items: stretch;
            }
            .group-drawer .group-item .group-actions {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>

    <!-- ─── LOGIN OVERLAY ─── -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>DISPATCH LOGIN</h2>
            <input type="email" id="loginEmail" placeholder="Email (@ec.com)" autofocus />
            <input type="password" id="loginPassword" placeholder="Password" />
            <button onclick="login()">Sign In</button>
            <div id="loginError"></div>
        </div>
    </div>

    <!-- ─── MAIN APP ─── -->
    <div id="app" style="display:none;">

        <!-- HEADER -->
        <header>
            <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
                <img src="icon2.png" onclick="openGroupManager()" style="height:32px; width:auto; cursor:pointer;" alt="Logo" />
                <span style="font-size:16px; font-weight:700; color:var(--text);">E&C DRIVER MAP</span>
                <span class="badge">LIVE</span>
            </div>
            <div style="display:flex; align-items:center; gap:6px; margin-left:auto;">
                <button class="gear-btn" onclick="location.reload(true);" title="Refresh page">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                </button>
                <button id="settingsBtn" class="gear-btn" onclick="openSettings()" title="Settings">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
                </button>
            </div>
        </header>

        <!-- MAP (full remaining space) -->
        <div class="map-wrapper" id="mainMapWrapper">
            <div id="dispatch-map"></div>
            <div id="zoomIndicator">0%</div>
        </div>

    </div>

    <!-- ─── SETTINGS MODAL ─── -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-card">
            <h2>Drivers and PAJ GPS</h2>

    </script>

    <script>
        // ═══════════════════════════════════════════════════════════════════
        //  FIREBASE
        // ═══════════════════════════════════════════════════════════════════
        firebase.initializeApp({
            apiKey: "AIzaSyAKmgoXA4m3cRTmxJq4aUyva5SVvFbTNqg",
            authDomain: "eandccourier-36fcc.firebaseapp.com",
            databaseURL: "https://eandccourier-36fcc-default-rtdb.firebaseio.com",
            projectId: "eandccourier-36fcc",
        });
        const auth = firebase.auth();

        // ═══════════════════════════════════════════════════════════════════
        //  MAP STYLES (dark only)
        // ═══════════════════════════════════════════════════════════════════
        const mapStyles = [{
            "featureType": "all",
            "elementType": "all",
            "stylers": [{ "invert_lightness": true }, { "saturation": 10 }, { "lightness": 30 }, { "gamma": 0.5 },
                { "hue": "#435158" }
            ]
        }];

        // ═══════════════════════════════════════════════════════════════════
        //  AUTH
        // ═══════════════════════════════════════════════════════════════════
        let currentUserId = null;

        function login() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';

                errorEl.textContent = 'Login failed: ' + err.message;

        auth.onAuthStateChanged(user => {
            if (user) {
                const email = user.email;
                if (!email.endsWith('@ec.com')) {
                    alert('Access denied. Only @ec.com emails allowed.');

                    if (typeof google !== 'undefined' && map) {
                        google.maps.event.trigger(map, 'resize');

                }, 100);

                const settingsBtn = document.getElementById('settingsBtn');
                if (email === 'justin@ec.com' || email === 'des@ec.com') {

                } else {
                    settingsBtn.style.display = 'none';

                initApp();
            } else {
                currentUserId = null;

                document.getElementById('app').style.display = 'none';
            }

        // ── Global paths for drivers and master_config ──
        function getDriversRef() {
            return db.ref('developer/dispatch_dashboard/drivers');
        }

        function getMasterRef() {
            return db.ref('developer/dispatch_dashboard/master_config');
        }

        // ── Per‑user path for groups ──
        function getGroupsRef() {
            if (!currentUserId) return null;
            return db.ref('users/' + currentUserId + '/dispatch_dashboard/groups');
        }

        // ═══════════════════════════════════════════════════════════════════
        //  STATE
        // ═══════════════════════════════════════════════════════════════════
        let drivers = {};
        let groups = {};
        let activeGroupId = null;
        let map = null;
        let driverMarkers = {};
        let pulseCircles = {};
        let pulseAnimationId = null;
        let gpsInterval = null;
        let pajToken = null;
        let authRetryInProgress = false;
        let zoomTimeout = null;
        let expandedGroupId = null;

        const PAJ_BASE = 'https://connect.paj-gps.de/api/v1';
        const STANDBY_THRESHOLD = 15 * 60 * 1000;
        const OFFLINE_THRESHOLD = 60 * 60 * 1000;

        // ── Active group from localStorage ──
        function loadActiveGroup() {
            const stored = localStorage.getItem('ec_active_group');
            if (stored) activeGroupId = stored;
            else activeGroupId = null;
        }

        function saveActiveGroup(id) {
            activeGroupId = id;
            if (id) localStorage.setItem('ec_active_group', id);
            else localStorage.removeItem('ec_active_group');
            applyFilter();
        }

        // ── Filtered drivers ──
        function getFilteredDrivers() {
            if (!activeGroupId) return drivers;
            const group = groups[activeGroupId];
            if (!group || !group.driverIds) return {};
            const filtered = {};
            for (let [id, drv] of Object.entries(drivers)) {
                if (group.driverIds[id]) {
                    filtered[id] = drv;
                }
            }
            return filtered;
        }

        function applyFilter() {
            updateMapMarkers();
            updateMapDriverControl();
            renderGroupManager();
            updateShowAllButton();
        }

        function updateShowAllButton() {
            const btn = document.getElementById('showAllBtn');
            if (!btn) return;
            if (!activeGroupId) {
                btn.classList.add('active');
                btn.textContent = 'Show All Drivers (active)';
            } else {
                btn.classList.remove('active');
                btn.textContent = 'Show All Drivers';
            }
        }

        // ═══════════════════════════════════════════════════════════════════
        //  GPS STATUS HELPER
        // ═══════════════════════════════════════════════════════════════════
        function getGPSStatus(lastUpdated, deviceStatus) {
            if (deviceStatus !== undefined) {
                if (deviceStatus === 1) return { status: 'online', label: '● Online', cls: 'online' };
                else if (deviceStatus === 2) return { status: 'standby', label: '◐ Standby', cls: 'standby' };
                else return { status: 'offline', label: '○ Offline', cls: 'offline' };
            }
            if (!lastUpdated) return { status: 'offline', label: '○ Offline', cls: 'offline' };
            const diff = Date.now() - lastUpdated;
            if (diff < STANDBY_THRESHOLD) return { status: 'online', label: '● Online', cls: 'online' };
            if (diff < OFFLINE_THRESHOLD) return { status: 'standby', label: '◐ Standby', cls: 'standby' };
            return { status: 'offline', label: '○ Offline', cls: 'offline' };
        }

        // ═══════════════════════════════════════════════════════════════════
        //  PAJ AUTH
        // ═══════════════════════════════════════════════════════════════════
        async function authenticatePAJ() {
            const masterRef = getMasterRef();
            if (!masterRef) return;
            let email = document.getElementById('pajEmail').value.trim();
            let pass = document.getElementById('pajPassword').value.trim();
            if (!email || !pass) {
                const snap = await masterRef.once('value');
                const cfg = snap.val() || {};
                email = cfg.paj_email || '';
                pass = cfg.paj_password || '';
                if (email) document.getElementById('pajEmail').value = email;
                if (pass) document.getElementById('pajPassword').value = pass;
            }
            if (!email || !pass) return;
            try {
                const response = await fetch(`${PAJ_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password: pass })
                });
                const data = await response.json();
                let token = data.success?.token || data.token;
                if (token) {
                    pajToken = token;
                    masterRef.update({ paj_token: token });
                    await fetchAllDevicePositions();
                }
            } catch (e) { console.warn('PAJ auth error:', e); }
        }

        async function testPAJConnection() {
            const debug = document.getElementById('debugOutput');
            const email = document.getElementById('pajEmail').value.trim();
            const pass = document.getElementById('pajPassword').value.trim();
            debug.innerHTML = '<span class="info">⏳ Testing connection...</span>';
            if (!email || !pass) {
                debug.innerHTML = '<span class="error">Please enter your PAJ GPS email and password first.</span>';
                return;
            }
            try {
                const loginRes = await fetch(`${PAJ_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password: pass })
                });
                const loginData = await loginRes.json();
                let token = loginData.success?.token || loginData.token;
                if (!token) { debug.innerHTML += `<span class="error">Login failed.</span>`; return; }
                debug.innerHTML += `<span class="success">Login successful!</span><br><br>`;
                const deviceRes = await fetch(`${PAJ_BASE}/device`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const devicesData = await deviceRes.json();
                let devices = devicesData.success || devicesData.data || devicesData;
                if (!Array.isArray(devices)) { debug.innerHTML += `<span class="error">No devices found.</span>`; return; }
                let html = `<span class="success">Found ${devices.length} device(s):</span><br><br>`;
                devices.forEach((d, i) => {
                    const devId = d.id || d.deviceId || d.imei || 'Unknown';
                    const name = d.name || d.deviceName || `Device ${i+1}`;
                    html += `<span class="info">${i+1}. </span><strong>${name}</strong><br>`;
                    html += `   Device ID: <span class="device-id">${devId}</span><br>`;
                });
                html += `<span class="info">Copy the Device ID and paste into each driver's settings.</span>`;
                debug.innerHTML = html;
                pajToken = token;
                const masterRef = getMasterRef();
                if (masterRef) masterRef.update({ paj_token: token });
                await fetchAllDevicePositions();
            } catch (e) {
                debug.innerHTML += `<span class="error">Error: ${e.message}</span>`;
            }
        }

        // ═══════════════════════════════════════════════════════════════════
        //  FETCH POSITIONS
        // ═══════════════════════════════════════════════════════════════════
        let deviceStatuses = {};

        async function fetchAllDevicePositions() {
            if (!pajToken) {
                await authenticatePAJ();
                if (!pajToken) return;
            }
            const entries = Object.entries(drivers).filter(([id, d]) => d.deviceId && String(d.deviceId).trim() !== '');
            if (entries.length === 0) return;

            const deviceIds = entries.map(([did, d]) => parseInt(String(d.deviceId).trim(), 10));
            const payload = { devicesId: deviceIds };

            try {
                const response = await fetch(`${PAJ_BASE}/getAllDeviceStatus`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${pajToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                if (response.status === 401 || response.status === 403) {
                    if (!authRetryInProgress) {
                        authRetryInProgress = true;
                        await authenticatePAJ();
                        authRetryInProgress = false;
                        await fetchAllDevicePositions();
                        return;
                    }
                    return;
                }
                if (!response.ok) return;
                const data = await response.json();
                if (!data.success || typeof data.success !== 'object') return;

                const now = Date.now();
                const driversRef = getDriversRef();
                if (!driversRef) return;

                for (const [deviceIdStr, deviceData] of Object.entries(data.success)) {
                    const devId = parseInt(deviceIdStr, 10);
                    if (!devId) continue;

                    const deviceStatus = deviceData.deviceStatus || {};
                    const connectionStatus = deviceStatus.connection_status;
                    if (connectionStatus !== undefined) {
                        deviceStatuses[devId] = connectionStatus;
                    }

                    const lastPoint = deviceData.lastPoint || null;
                    const battery = lastPoint?.battery ?? lastPoint?.battery_level ?? 0;
                    const heading = lastPoint?.direction ?? null;
                    const hasAlarm = !!(deviceStatus.movementAlarm || deviceStatus.tiltAlarm ||
                        deviceStatus.removeAlarm || deviceStatus.sosAlarm);
                    const odometer = deviceStatus.totalDistance || deviceStatus.odometer || 0;

                    if (lastPoint && lastPoint.lat !== undefined && lastPoint.lng !== undefined) {
                        const lat = lastPoint.lat;
                        const lng = lastPoint.lng;
                        if (!isNaN(lat) && !isNaN(lng)) {
                            const tsSec = lastPoint.dateunix;
                            let pajTimestamp = now;
                            if (tsSec && !isNaN(tsSec)) pajTimestamp = tsSec * 1000;

                            for (let [did, drv] of Object.entries(drivers)) {
                                const drvDeviceId = drv.deviceId ? String(drv.deviceId).trim() : '';
                                if (drvDeviceId && drvDeviceId === String(devId)) {
                                    drv.lastLocation = { lat, lng, updatedAt: pajTimestamp };
                                    drv.battery = battery;
                                    drv.heading = heading;
                                    drv.hasAlarm = hasAlarm;
                                    drv.odometer = odometer;
                                    drv._status = connectionStatus;
                                    driversRef.child(did).update({
                                        lastLocation: drv.lastLocation,
                                        battery: battery,
                                        heading: heading,
                                        hasAlarm: hasAlarm,
                                        odometer: odometer,
                                        _status: connectionStatus
                                    });
                                    break;
                                }
                            }
                        }
                    }
                }
                applyFilter();
            } catch (e) {
                console.warn('PAJ fetch error:', e);
            }
        }

        // ═══════════════════════════════════════════════════════════════════
        //  MAP INIT
        // ═══════════════════════════════════════════════════════════════════
        let mapInitialized = false;

        function initMap() {
            if (mapInitialized) return;
            const center = { lat: 49.8425, lng: -99.9497 };

            map = new google.maps.Map(document.getElementById('dispatch-map'), {
                center: center,
                zoom: 11,
                styles: mapStyles,
                gestureHandling: 'greedy',
                mapTypeControl: false,
                fullscreenControl: true,
            });
            mapInitialized = true;

            // ── Zoom indicator ──
            google.maps.event.addListener(map, 'zoom_changed', function() {
                const zoom = map.getZoom();
                const pct = Math.min(Math.round((zoom / 20) * 100), 100);
                const indicator = document.getElementById('zoomIndicator');
                if (indicator) {
                    indicator.textContent = pct + '%';
                    indicator.style.opacity = '1';
                    if (zoomTimeout) clearTimeout(zoomTimeout);
                    zoomTimeout = setTimeout(() => {
                        indicator.style.opacity = '0';
                    }, 2000);
                }
            });

            // ── Driver control (top-left) ──
            const driverControlDiv = document.createElement('div');
            driverControlDiv.id = 'mapDriverControl';
            driverControlDiv.className = 'map-driver-control';
            map.controls[google.maps.ControlPosition.TOP_LEFT].push(driverControlDiv);
            updateMapDriverControl();

            // ── Custom controls container (right side) ──
            const controlsContainer = document.createElement('div');
            controlsContainer.id = 'mapControlsContainer';
            controlsContainer.className = 'map-controls-container';

            // Fit button
            const fitBtn = document.createElement('button');
            fitBtn.className = 'map-control-btn fit-btn';
            fitBtn.setAttribute('aria-label', 'Fit all drivers');
            fitBtn.innerHTML = `
                <svg viewBox="0 0 24 24"><path d="M3 3v6h2V5h4V3H3zm16 0v6h2V3h-6v2h4zM3 21v-6h2v4h4v2H3zm16 0v-6h2v6h-6v-2h4z"/><rect x="5" y="5" width="14" height="14" rx="1" stroke="currentColor" fill="none"/></svg>
            `;
            fitBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                fitMapToDrivers();
            });
            controlsContainer.appendChild(fitBtn);

            // Map type dropdown
            const mapTypeBtn = document.createElement('button');
            mapTypeBtn.className = 'map-control-btn map-type-btn';
            mapTypeBtn.textContent = 'Road';
            mapTypeBtn.setAttribute('aria-label', 'Change map type');
            const mapTypes = ['roadmap', 'satellite', 'hybrid', 'terrain'];
            const mapTypeLabels = ['Road', 'Satellite', 'Hybrid', 'Terrain'];
            let mapTypeIndex = 0;
            mapTypeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                mapTypeIndex = (mapTypeIndex + 1) % mapTypes.length;
                const type = mapTypes[mapTypeIndex];
                map.setMapTypeId(type);
                mapTypeBtn.textContent = mapTypeLabels[mapTypeIndex];
            });
            controlsContainer.appendChild(mapTypeBtn);

            map.controls[google.maps.ControlPosition.RIGHT_TOP].push(controlsContainer);

            // ── Restore map state ──
            const masterRef = getMasterRef();
            if (masterRef) {
                masterRef.once('value').then(snap => {
                    const cfg = snap.val() || {};
                    if (cfg.map_center_lat && cfg.map_center_lng && cfg.map_zoom) {
                        map.setCenter({ lat: cfg.map_center_lat, lng: cfg.map_center_lng });
                        map.setZoom(cfg.map_zoom);
                    }
                });
            }

            google.maps.event.addListener(map, 'idle', function() {
                const center = map.getCenter();
                const zoom = map.getZoom();
                const masterRef2 = getMasterRef();
                if (center && zoom && masterRef2) {
                    masterRef2.update({
                        map_center_lat: center.lat(),
                        map_center_lng: center.lng(),
                        map_zoom: zoom
                    });
                }
            });

            // Initial markers
            applyFilter();

            setTimeout(() => google.maps.event.trigger(map, 'resize'), 200);
        }

        // ═══════════════════════════════════════════════════════════════════
        //  MAP MARKERS
        // ═══════════════════════════════════════════════════════════════════
        function updateMapMarkers() {
            if (!map) return;

            Object.values(driverMarkers).forEach(m => m.setMap(null));
            driverMarkers = {};
            for (let id in pulseCircles) {
                if (pulseCircles[id]) pulseCircles[id].setMap(null);
            }
            pulseCircles = {};

            const filtered = getFilteredDrivers();

            for (let [id, drv] of Object.entries(filtered)) {
                if (!drv.lastLocation) continue;
                const pos = drv.lastLocation;
                const color = drv.color || '#f7c948';
                const icon = getDriverIcon(drv.name || 'Driver', color, drv.heading);
                const marker = new google.maps.Marker({
                    position: { lat: pos.lat, lng: pos.lng },
                    map: map,
                    icon: icon,
                    title: drv.name || 'Driver'
                });
                driverMarkers[id] = marker;

                marker.addListener('click', function() {
                    zoomToDriver(id);
                });

                const circle = new google.maps.Circle({
                    center: { lat: pos.lat, lng: pos.lng },
                    radius: 15,
                    fillColor: color,
                    fillOpacity: 0.2,
                    strokeColor: color,
                    strokeOpacity: 0.6,
                    strokeWeight: 2,
                    map: map
                });
                pulseCircles[id] = circle;
            }

            if (Object.keys(pulseCircles).length > 0) startPulseAnimation();
            else if (pulseAnimationId) cancelAnimationFrame(pulseAnimationId);
        }

        function getDriverIcon(name, color, heading) {
            const safeName = name.replace(/'/g, "\\'");
            const svg =
                `<svg xmlns="http://www.w3.org/2000/svg" width="50" height="60"><text x="25" y="14" text-anchor="middle" fill="white" font-size="12" font-weight="bold">${safeName}</text><circle cx="25" cy="40" r="12" fill="${color}" stroke="white" stroke-width="2"/></svg>`;
            return {
                url: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
                anchor: new google.maps.Point(25, 40),
                scaledSize: new google.maps.Size(50, 60),
                rotation: heading || 0
            };
        }

        function startPulseAnimation() {
            if (pulseAnimationId) cancelAnimationFrame(pulseAnimationId);
            let startTime = performance.now();

            function animate(time) {
                const elapsed = (time - startTime) / 1000;
                const zoom = map ? map.getZoom() : 10;
                const metersPerPixel = 156000 / Math.pow(2, zoom);
                const desiredPixelRadius = 20;
                let radius = desiredPixelRadius * metersPerPixel;
                radius = Math.min(radius, 5000);
                radius = Math.max(radius, 5);
                const pulse = 1 + 0.3 * Math.sin(elapsed * 2.5);
                const finalRadius = radius * pulse;
                for (let id in pulseCircles) {
                    if (pulseCircles[id]) pulseCircles[id].setRadius(finalRadius);
                }
                pulseAnimationId = requestAnimationFrame(animate);
            }
            pulseAnimationId = requestAnimationFrame(animate);
        }

        // ═══════════════════════════════════════════════════════════════════
        //  ZOOM TO DRIVER (70% zoom level = zoom 14)
        // ═══════════════════════════════════════════════════════════════════
        function zoomToDriver(driverId) {
            const drv = drivers[driverId];
            if (!drv || !drv.lastLocation) return;
            const lat = drv.lastLocation.lat;
            const lng = drv.lastLocation.lng;
            if (isNaN(lat) || isNaN(lng)) return;

            // Zoom to level 14 (approx 70% of max zoom 20) for a clear view
            map.panTo({ lat, lng });
            map.setZoom(14);
        }

        // ═══════════════════════════════════════════════════════════════════
        //  FIT MAP TO DRIVERS
        // ═══════════════════════════════════════════════════════════════════
        function fitMapToDrivers() {
            const filtered = getFilteredDrivers();
            const bounds = new google.maps.LatLngBounds();
            let hasPoints = false;
            for (let drv of Object.values(filtered)) {
                if (drv.lastLocation && drv.lastLocation.lat && drv.lastLocation.lng) {
                    bounds.extend({ lat: drv.lastLocation.lat, lng: drv.lastLocation.lng });
                    hasPoints = true;
                }
            }
            if (hasPoints) map.fitBounds(bounds);
        }

        // ═══════════════════════════════════════════════════════════════════
        //  MAP DRIVER CONTROL (top-left list)
        // ═══════════════════════════════════════════════════════════════════
        function updateMapDriverControl() {
            const container = document.getElementById('mapDriverControl');
            if (!container) return;
            const filtered = getFilteredDrivers();
            const entries = Object.entries(filtered);
            if (entries.length === 0) {
                container.innerHTML = '<div class="no-drivers">No drivers to show.</div>';
                return;
            }
            let html = '';
            for (let [id, drv] of entries) {
                const status = getGPSStatus(drv.lastLocation?.updatedAt, drv._status);
                const color = drv.color || '#f7c948';
                html += `
                    <div class="driver-entry" onclick="zoomToDriver('${id}')">
                        <span class="driver-dot" style="background:${color};"></span>
                        <span class="driver-name">${drv.name || 'Driver'}</span>
                        <span class="driver-status ${status.cls}">${status.label}</span>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // ═══════════════════════════════════════════════════════════════════
        //  SETTINGS
        // ═══════════════════════════════════════════════════════════════════
        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
            renderSettingsList();
            const masterRef = getMasterRef();
            if (masterRef) {
                masterRef.once('value').then(snap => {
                    const cfg = snap.val() || {};
                    document.getElementById('pajEmail').value = cfg.paj_email || '';
                    document.getElementById('pajPassword').value = cfg.paj_password || '';
                });
            }
        }

        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        function renderSettingsList() {
            const container = document.getElementById('driverSettingsList');
            container.innerHTML = '';
            for (let [id, drv] of Object.entries(drivers)) {
                const row = document.createElement('div');
                row.className = 'driver-row';
                row.innerHTML = `
                    <input type="text" value="${drv.name || ''}" placeholder="Name" data-id="${id}" class="drv-name">
                    <input type="color" value="${drv.color || '#f7c948'}" data-id="${id}" class="drv-color color-pick">
                    <input type="text" value="${drv.deviceId || ''}" placeholder="Device ID" data-id="${id}" class="drv-device">
                    <button class="remove-driver" onclick="removeDriver('${id}')">Remove</button>
                `;
                container.appendChild(row);
            }
        }

        function addDriverRow() {
            const ref = getDriversRef();
            if (ref) ref.push({ name: 'Driver', color: '#f7c948', deviceId: '', lastLocation: null });
        }

        function removeDriver(id) {
            if (!confirm('Remove this driver?')) return;
            const ref = getDriversRef();
            if (ref) ref.child(id).remove();
        }

        function saveSettings() {
            const email = document.getElementById('pajEmail').value.trim();
            const pass = document.getElementById('pajPassword').value.trim();
            const masterRef = getMasterRef();
            if (masterRef) {
                masterRef.update({
                    paj_email: email,
                    paj_password: pass,
                });
            }

            const rows = document.querySelectorAll('#driverSettingsList .driver-row');
            const driversRef = getDriversRef();
            if (!driversRef) return;
            rows.forEach(row => {
                const id = row.querySelector('.drv-name').dataset.id;
                const name = row.querySelector('.drv-name').value;
                const color = row.querySelector('.drv-color').value;
                const deviceId = row.querySelector('.drv-device').value;
                if (id) {
                    driversRef.child(id).update({ name, color, deviceId });
                }
            });
            if (email && pass) authenticatePAJ();
            closeSettings();
        }

        // ═══════════════════════════════════════════════════════════════════
        //  GROUP MANAGER
        // ═══════════════════════════════════════════════════════════════════
        function openGroupManager() {
            const overlay = document.getElementById('groupDrawerOverlay');
            const drawer = document.getElementById('groupDrawer');
            overlay.style.display = 'block';
            drawer.classList.add('open');
            renderGroupManager();
            updateShowAllButton();
        }

        function closeGroupManager() {
            const overlay = document.getElementById('groupDrawerOverlay');
            const drawer = document.getElementById('groupDrawer');
            overlay.style.display = 'none';
            drawer.classList.remove('open');
            expandedGroupId = null;
        }

        async function createGroup() {
            const input = document.getElementById('newGroupName');
            const name = input.value.trim();
            if (!name) { alert('Please enter a group name.'); return; }
            const ref = getGroupsRef();
            if (!ref) return;
            await ref.push({ name: name, driverIds: {} });
            input.value = '';
            renderGroupManager();
        }

        function renderGroupManager() {
            const container = document.getElementById('groupList');
            const entries = Object.entries(groups);
            if (entries.length === 0) {
                container.innerHTML = '<div class="no-groups">No groups yet. Create one above.</div>';
                return;
            }
            let html = '';
            for (let [id, group] of entries) {
                const isActive = (activeGroupId === id);
                const isExpanded = (expandedGroupId === id);
                const driverIds = group.driverIds || {};
                const driverCount = Object.keys(driverIds).length;

                html += `<div class="group-item${isActive ? ' active' : ''}" data-group-id="${id}">`;
                html += `<div class="group-row">`;
                html += `<span class="group-name">${group.name || 'Unnamed'} (${driverCount})</span>`;
                html += `<div class="group-actions">`;
                if (isActive) {
                    html += `<button class="show-btn active-btn" onclick="showGroup('${id}')">Active</button>`;
                } else {
                    html += `<button class="show-btn" onclick="showGroup('${id}')">Show</button>`;
                }
                html += `<button onclick="toggleAddDrivers('${id}')">Add Driver</button>`;
                html += `<button class="remove-group" onclick="removeGroup('${id}')">Remove</button>`;
                html += `</div></div>`;

                html += `<div class="driver-check-list${isExpanded ? ' open' : ''}" id="checkList_${id}">`;
                const driverEntries = Object.entries(drivers);
                if (driverEntries.length === 0) {
                    html += `<div style="color:var(--muted); font-size:13px; padding:4px 0;">No drivers available.</div>`;
                } else {
                    for (let [did, drv] of driverEntries) {
                        const checked = driverIds[did] ? 'checked' : '';
                        html += `
                            <div class="check-row">
                                <input type="checkbox" id="chk_${id}_${did}" ${checked} />
                                <label for="chk_${id}_${did}">${drv.name || 'Driver'}</label>
                            </div>
                        `;
                    }
                    html += `<button class="save-drivers-btn" onclick="saveGroupDrivers('${id}')">Save</button>`;
                }
                html += `</div>`;
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function toggleAddDrivers(groupId) {
            if (expandedGroupId === groupId) {
                expandedGroupId = null;
            } else {
                expandedGroupId = groupId;
            }
            renderGroupManager();
        }

        async function saveGroupDrivers(groupId) {
            const group = groups[groupId];
            if (!group) return;
            const checkList = document.getElementById(`checkList_${groupId}`);
            if (!checkList) return;
            const checkboxes = checkList.querySelectorAll('input[type="checkbox"]');
            const driverIds = {};
            checkboxes.forEach(cb => {
                if (cb.checked) {
                    const did = cb.id.replace(`chk_${groupId}_`, '');
                    driverIds[did] = true;
                }
            });
            const ref = getGroupsRef();
            if (!ref) return;
            await ref.child(groupId).child('driverIds').set(driverIds);
            expandedGroupId = null;
            renderGroupManager();
            applyFilter();
        }

        function showGroup(groupId) {
            const group = groups[groupId];
            if (!group) return;
            saveActiveGroup(groupId);
            applyFilter();
            renderGroupManager();
            updateShowAllButton();
        }

        function showAllDrivers() {
            saveActiveGroup(null);
            applyFilter();
            renderGroupManager();
            updateShowAllButton();
        }

        async function removeGroup(groupId) {
            if (!confirm('Remove this group?')) return;
            const ref = getGroupsRef();
            if (!ref) return;
            await ref.child(groupId).remove();
            if (activeGroupId === groupId) {
                saveActiveGroup(null);
            }
            renderGroupManager();
            applyFilter();
            updateShowAllButton();
        }

        // ── Groups listener ──
        function listenGroups() {
            const ref = getGroupsRef();
            if (!ref) return;
            ref.on('value', snap => {
                groups = snap.val() || {};
                // If active group no longer exists, clear it
                if (activeGroupId && !groups[activeGroupId]) {
                    saveActiveGroup(null);
                }
                renderGroupManager();
                updateShowAllButton();
                applyFilter();
            });
        }

        // ═══════════════════════════════════════════════════════════════════
        //  INIT APP
        // ═══════════════════════════════════════════════════════════════════
        function initApp() {
            loadActiveGroup();

            // Load drivers (global)
            const driversRef = getDriversRef();
            if (driversRef) {
                driversRef.on('value', snap => {
                    drivers = snap.val() || {};
                    applyFilter();
                    renderSettingsList();
                });
            }

            // Load master config (global)
            const masterRef = getMasterRef();
            if (masterRef) {
                masterRef.once('value').then(snap => {
                    const cfg = snap.val() || {};
                    document.getElementById('pajEmail').value = cfg.paj_email || '';
                    document.getElementById('pajPassword').value = cfg.paj_password || '';
                    pajToken = cfg.paj_token || null;
                    if (cfg.paj_email && cfg.paj_password) authenticatePAJ();

                    if (map && cfg.map_center_lat && cfg.map_center_lng && cfg.map_zoom) {
                        map.setCenter({ lat: cfg.map_center_lat, lng: cfg.map_center_lng });
                        map.setZoom(cfg.map_zoom);
                    }
                }).catch(() => {
                    if (masterRef) masterRef.set({ paj_email: '', paj_password: '', paj_token: '' });
                });
            }

            // Listen for groups (per‑user)
            listenGroups();

            // GPS polling
            if (gpsInterval) clearInterval(gpsInterval);
            gpsInterval = setInterval(() => {
                if (pajToken) fetchAllDevicePositions();
            }, 15000);
            setTimeout(() => { if (pajToken) fetchAllDevicePositions(); }, 3000);

            window.addEventListener('beforeunload', function() {
                if (gpsInterval) clearInterval(gpsInterval);
                if (pulseAnimationId) cancelAnimationFrame(pulseAnimationId);
                if (zoomTimeout) clearTimeout(zoomTimeout);
            });
        }

        // ── Enter key on login ──
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const overlay = document.getElementById('login-overlay');
                if (overlay.style.display !== 'none') {
                    login();
                    e.preventDefault();
                }
            }
            if (e.key === 'Escape') {
                const settings = document.getElementById('settingsModal');
                if (settings.style.display === 'flex') {
                    closeSettings();
                    e.preventDefault();
                }
                const drawer = document.getElementById('groupDrawer');
                if (drawer.classList.contains('open')) {
                    closeGroupManager();
                    e.preventDefault();
                }
            }
        });

        console.log('E&C DRIVER MAP loaded.');
        console.log('Click a driver name in the top-left list to zoom to their location.');
        console.log('Settings are only available for justin@ec.com and des@ec.com.');
        console.log('Click the logo to manage driver groups.');
    </script>
</body>
</html>
